# Dependabot: weekly update PRs for the Go modules, the browser tests' npm
# packages and the GitHub Actions. Security updates (repository settings)
# come on top, as soon as an advisory appears.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      go-modules:
        patterns: ["*"]
        # Ebitengine upgrades are their own PRs (CONTRIBUTING).
        exclude-patterns: ["github.com/hajimehoshi/ebiten/*"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      e2e:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
