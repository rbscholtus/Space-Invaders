# Dependabot: weekly update PRs for the Go modules and the GitHub Actions.
# Security updates (repository settings) come on top, as soon as an advisory
# appears. The npm entry for e2e/ is added with the browser tests (ROADMAP M4).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      go-modules:
        patterns: ["*"]
        # Ebitengine upgrades are their own PRs (CONTRIBUTING).
        exclude-patterns: ["github.com/hajimehoshi/ebiten/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
